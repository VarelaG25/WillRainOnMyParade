<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaceapps</title>
    <link rel="icon" href="../../public/logo.png">
    <style>
      @font-face {
        font-family: "Varien";
        src: url(../../public/varien.regular.ttf)format(truetype);
      }
      body {
        margin: 0;
      }
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        color: white;
        display: flex;
       flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: Varien;
        transition: opacity 1s ease;
        z-index: 10; 
      }

    #overlay.hidden {
        opacity: 0;
        pointer-events: none; 
      }

    #overlay h1 {
         font-size: 10em;
         margin-bottom: 0.3em;
      }

       .exit-anim {
    animation: slideOut 1s ease forwards;
  }

  @keyframes slideOut {
    0% {
      transform: translateX(0);
      filter: blur(0px);
      opacity: 1;
    }
    50% {
      filter: blur(4px);
    }
    100% {
      transform: translateX(-100%);
      filter: blur(8px);
      opacity: 0;
    }
  }
    </style>
    <script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js",
          "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/"
        }
			}
		</script>
    <div id="overlay">
     <h1>Spaceapps</h1>
    </div>

  </head>
  <body>
    <script type="module" src="index.js"></script>
  </body>
</html>
